name: Build & Publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to increment"
        required: false
        default: patch
        type: choice
        options: [ patch, minor, major ]

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      sources_changed: ${{ steps.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew jvmTest

      - name: Check if sources changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE "^src/common(Main|Test)/"; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name != 'pull_request' &&
      (needs.build.outputs.sources_changed == 'true' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Bump version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ github.event.inputs.bump || 'patch' }}

      - name: Publish to GitHub Packages
        run: ./gradlew publish -Pversion=${{ steps.tag.outputs.new_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Update version badge in README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i "s|version-[0-9][0-9.]*-blue|version-${{ steps.tag.outputs.new_version }}-blue|" README.md
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update version badge to ${{ steps.tag.outputs.new_tag }}"
          git push